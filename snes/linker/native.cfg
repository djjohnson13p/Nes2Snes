MEMORY {
    ROM:    start = $008000, size = $7FC0, file = %O, fill = yes, fillval = $FF;
    HEADER: start = $00FFC0, size = $0020, file = %O, fill = yes;
    VECTOR: start = $00FFE0, size = $0020, file = %O, fill = yes;
    VENEER: start = $001000, size = $0800, file = "";
}
SEGMENTS {
    CODE:   load = ROM, type = ro;
    RODATA: load = ROM, type = ro;
    STUBS:  load = ROM, run = VENEER, type = ro, define = yes;
    HEADER: load = HEADER, type = ro;
    VECTOR: load = VECTOR, type = ro;
}
