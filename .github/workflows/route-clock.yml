name: Guarded update clocks and route evidence
on:
  workflow_dispatch:
  push:
    branches: [main, development/route-clock-20260926]
    paths:
      - '.github/workflows/route-clock.yml'
      - 'tools/**'
      - 'tests/**'
      - 'snes/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
      - name: Unit tests including real assembler checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Build pinned original NES core and separate probe
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/reference-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/fceumm_reference.so
          /usr/bin/python3 tools/instrument_fceumm.py build/fceumm
          make -C build/fceumm -f Makefile.libretro -j2 > build/probe-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/fceumm_probe.so
      - name: Guarded clocks against independent NES counters and RAM
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_update_clock.py \
            --probe-core build/fceumm_probe.so \
            --reference-core build/fceumm_reference.so \
            --out build/update-clock 2>&1 | tee build/update-clock.log
      - name: Build pinned SNES core
        run: |
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes9x-build.log 2>&1
      - name: Retain independent runtime safety and audio stress
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/fceumm_reference.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-safety 2>&1 | tee build/runtime-safety.log
      - name: Archive exact tested source
        run: |
          git archive --format=zip --output=build/tested-source.zip HEAD
          git rev-parse HEAD > build/tested-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-clock-verification
          path: |
            build/*.log
            build/update-clock/update-clock-verification.json
            build/update-clock/progress.json
            build/runtime-safety/runtime-counter-verification.json
            build/runtime-safety/progress.json
            build/tested-source.zip
            build/tested-revision.txt
          retention-days: 30
