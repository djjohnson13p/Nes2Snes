name: Native controller and frame-cost verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-controller.yml'
      - 'snes/**'
      - 'tools/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
      - name: Unit and callback-tag tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build pinned unmodified NES and SNES emulators
        run: |
          mkdir -p build
          git clone https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2
          git clone https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2
      - name: Twenty-five independent native-poll and fallback configurations
        run: |
          /usr/bin/python3 tools/verify_native_controller.py \
            --nes-core build/fceumm/fceumm_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/controller-matrix
      - name: Retained CPU, mapper, unknown-code and audio stress regressions
        run: |
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/fceumm/fceumm_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-counter-matrix
          /usr/bin/python3 tools/verify_indexed_matrix.py \
            --nes-core build/fceumm/fceumm_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/indexed-matrix
      - name: Compile and smoke-test the separate diagnostic clock probe
        run: |
          cp -a build/snes9x build/profile-core
          /usr/bin/python3 tools/instrument_frame_costs.py build/profile-core
          make -C build/profile-core/libretro -j2
          /usr/bin/python3 tools/profile_frame_costs.py \
            --core build/profile-core/libretro/snes9x_libretro.so \
            --rom build/controller-matrix/input-00/snes/native-prototype.sfc \
            --symbols build/controller-matrix/input-00/snes/native.lbl \
            --start 5 --end 15 --out build/profile-smoke.json
      - name: Archive exact tested source
        run: |
          git archive --format=zip --output=build/tested-source.zip HEAD
          git rev-parse HEAD > build/tested-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-controller-and-clock-verification
          path: |
            build/controller-matrix/controller-verification.json
            build/controller-matrix/progress.json
            build/runtime-counter-matrix/runtime-counter-verification.json
            build/runtime-counter-matrix/progress.json
            build/indexed-matrix/indexed-matrix.json
            build/profile-smoke.json
            build/tested-source.zip
            build/tested-revision.txt
          retention-days: 30
