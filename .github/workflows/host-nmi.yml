name: Hardware host NMI and timeline context preservation
on:
  workflow_dispatch:
  push:
    branches: [main, development/host-nmi-context-20260926]
    paths:
      - '.github/workflows/host-nmi.yml'
      - 'tools/**'
      - 'tests/**'
      - 'snes/**'
  pull_request:
    paths:
      - '.github/workflows/host-nmi.yml'
      - 'tools/timeline*'
      - 'tools/host_nmi_fixture.py'
      - 'tools/verify_host_nmi*'
      - 'tools/verify_timeline.py'
      - 'tools/instrument_timeline_probe.py'
      - 'tests/test_host_nmi.py'
      - 'snes/src/timeline_host_nmi.inc'
      - 'snes/src/guest_*.inc'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and exact tested source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
          mkdir -p build
          git rev-parse HEAD > build/tested-revision.txt
          git archive --format=zip --output=build/tested-source.zip HEAD
      - name: Unit tests including real NMI-envelope assembly
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Build pinned independent NES and unmodified SNES cores
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-plain-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-plain.so
          /usr/bin/python3 tools/instrument_timeline_probe.py build/fceumm
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-stimulus-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-stimulus.so
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes-build.log 2>&1
      - name: Hardware NMI, nested contexts, independent streams and negative controls
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_host_nmi_matrix.py \
            --nes-plain build/nes-plain.so --nes-probe build/nes-stimulus.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/host-nmi 2>&1 | tee build/host-nmi.log
      - name: Retain independent runtime safety and audio stress
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/nes-plain.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-safety 2>&1 | tee build/runtime-safety.log
      - name: Archive full authored inputs, generated source and captures
        if: always()
        run: |
          if test -d build/host-nmi; then
            find build/host-nmi -type f \( -name '*.json' -o -name '*.inc' -o -name '*.s' -o -name 'inputs.bin' -o -name 'scratch.bin' \) -print0 \
              | tar --null -T - -czf build/host-nmi-evidence.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-nmi-verification
          path: |
            build/*.log
            build/tested-revision.txt
            build/tested-source.zip
            build/host-nmi-evidence.tar.gz
            build/host-nmi/host-nmi-verification.json
            build/host-nmi/progress.json
            build/runtime-safety/runtime-counter-verification.json
          retention-days: 30
