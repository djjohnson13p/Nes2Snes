name: Original-cycle accounting and independent execution
on:
  workflow_dispatch:
  push:
    branches: [main, development/guest-cycle-accounting-20260926]
    paths:
      - '.github/workflows/guest-cycles.yml'
      - 'tools/**'
      - 'tests/**'
      - 'snes/**'
  pull_request:
    paths:
      - '.github/workflows/guest-cycles.yml'
      - 'tools/guest_cycle*'
      - 'tools/cycle_observer.h'
      - 'tools/instrument_cycle_observer.py'
      - 'tools/verify_guest_cycle*'
      - 'tests/test_guest_cycles.py'
      - 'tests/test_cycle_observer.py'
      - 'snes/src/guest_cycles.inc'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and exact tested revision
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
          mkdir -p build
          git rev-parse HEAD > build/tested-revision.txt
          git archive --format=zip --output=build/tested-source.zip HEAD
      - name: Unit and compiled native-assembly checks
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Build pinned independent NES and SNES cores
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-plain-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-plain.so
          /usr/bin/python3 tools/instrument_cycle_observer.py build/fceumm
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-observed-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-observed.so
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes-build.log 2>&1
      - name: Every official opcode against independent execution
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_guest_cycles.py \
            --nes-plain build/nes-plain.so --nes-observed build/nes-observed.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/guest-cycles 2>&1 | tee build/guest-cycles.log
      - name: Full instruction window and external-stall rejection
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_guest_cycle_windows.py \
            --nes-plain build/nes-plain.so --nes-observed build/nes-observed.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/guest-cycle-windows 2>&1 | tee build/guest-cycle-windows.log
      - name: Retain independent runtime safety
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/nes-plain.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-safety 2>&1 | tee build/runtime-safety.log
      - name: Archive compact full-window observation
        if: always()
        run: |
          if test -f build/guest-cycle-windows/observed.json; then
            gzip -c build/guest-cycle-windows/observed.json > build/cycle-window-observed.json.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-cycle-verification
          path: |
            build/*.log
            build/tested-revision.txt
            build/tested-source.zip
            build/cycle-window-observed.json.gz
            build/guest-cycles/plan.json
            build/guest-cycles/guest-cycle-verification.json
            build/guest-cycles/plain/capture.json
            build/guest-cycles/observed/capture.json
            build/guest-cycles/native-*/capture.json
            build/guest-cycles/unknown-*/capture.json
            build/guest-cycles/missing-pointers/capture.json
            build/guest-cycles/mutated-*/capture.json
            build/guest-cycle-windows/plain.json
            build/guest-cycle-windows/guest-cycle-window-verification.json
            build/guest-cycle-windows/dma-*/capture.json
            build/runtime-safety/runtime-counter-verification.json
          retention-days: 30
