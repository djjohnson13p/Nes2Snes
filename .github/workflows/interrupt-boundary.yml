name: Sampled interrupt entry and complete stack verification
on:
  workflow_dispatch:
  push:
    branches: [main, development/interrupt-boundary-20260926]
    paths:
      - '.github/workflows/interrupt-boundary.yml'
      - 'tools/**'
      - 'tests/**'
      - 'snes/**'
  pull_request:
    paths:
      - '.github/workflows/interrupt-boundary.yml'
      - 'tools/interrupt_*.py'
      - 'tools/interrupt_probe.h'
      - 'tools/instrument_interrupt_probe.py'
      - 'tools/verify_interrupt_boundary.py'
      - 'tools/guest_cycle_fixture.py'
      - 'tests/test_interrupt_boundary.py'
      - 'snes/src/guest_interrupt.inc'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and exact source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
          mkdir -p build
          git rev-parse HEAD > build/tested-revision.txt
          git archive --format=zip --output=build/tested-source.zip HEAD
      - name: Unit, actual assembler and compiled harness tests
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Build pinned original cores and external-request test core
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-plain-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-plain.so
          /usr/bin/python3 tools/instrument_interrupt_probe.py build/fceumm
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-request-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-request.so
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes-build.log 2>&1
      - name: Independent interrupt decisions, full stack and native caller context
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_interrupt_boundary.py \
            --nes-plain build/nes-plain.so --nes-probe build/nes-request.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/interrupt-boundary 2>&1 | tee build/interrupt-boundary.log
      - name: Retain independent runtime safety and fault guards
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/nes-plain.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-safety 2>&1 | tee build/runtime-safety.log
      - name: Compact complete independent captures
        if: always()
        run: |
          for role in observed plain; do
            if test -f build/interrupt-boundary/$role/capture.json; then
              gzip -c build/interrupt-boundary/$role/capture.json > build/interrupt-$role.json.gz
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interrupt-boundary-verification
          path: |
            build/*.log
            build/*.json.gz
            build/tested-revision.txt
            build/tested-source.zip
            build/interrupt-boundary/plan.json
            build/interrupt-boundary/interrupt-boundary-verification.json
            build/interrupt-boundary/native-*/capture.json
            build/interrupt-boundary/invalid-*/capture.json
            build/interrupt-boundary/wrong-*/capture.json
            build/runtime-safety/runtime-counter-verification.json
          retention-days: 30
