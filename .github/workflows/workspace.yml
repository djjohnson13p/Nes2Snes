name: Recover development workspace
on:
  push:
    paths:
      - '.github/workflows/workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Package repository and compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65
          mkdir -p recovery/bin recovery/cores
          git archive --format=tar HEAD | gzip > recovery/project-source.tar.gz
          git rev-parse HEAD > recovery/project-revision.txt
          cp /usr/bin/ca65 /usr/bin/ld65 /usr/bin/da65 recovery/bin/
          cp -r /usr/share/doc/cc65 recovery/cc65-license
      - name: Build pinned emulator sources
        run: |
          git clone https://github.com/libretro/snes9x.git /tmp/snes9x
          git -C /tmp/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C /tmp/snes9x/libretro -j2
          cp /tmp/snes9x/libretro/snes9x_libretro.so recovery/cores/
          git clone https://github.com/libretro/libretro-fceumm.git /tmp/libretro-fceumm
          git -C /tmp/libretro-fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C /tmp/libretro-fceumm -f Makefile.libretro -j2
          cp /tmp/libretro-fceumm/fceumm_libretro.so recovery/cores/fceumm_reference.so
          python3 tools/instrument_fceumm.py /tmp/libretro-fceumm
          make -C /tmp/libretro-fceumm -f Makefile.libretro -j2
          cp /tmp/libretro-fceumm/fceumm_libretro.so recovery/cores/fceumm_probe.so
          tar --exclude=.git -czf recovery/snes9x-source.tar.gz -C /tmp snes9x
          tar --exclude=.git -czf recovery/fceumm-probe-source.tar.gz -C /tmp libretro-fceumm
          sha256sum recovery/bin/* recovery/cores/* recovery/*tar.gz > recovery/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: recoverable-workspace
          path: recovery/
          retention-days: 30
