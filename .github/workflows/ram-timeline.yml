name: Guarded internal RAM and dependent timeline
on:
  workflow_dispatch:
  push:
    branches: [main, development/ram-timeline-20260926]
    paths:
      - '.github/workflows/ram-timeline.yml'
      - 'tools/**'
      - 'tests/**'
      - 'snes/**'
  pull_request:
    paths:
      - '.github/workflows/ram-timeline.yml'
      - 'tools/timeline*'
      - 'tools/ram_timeline_fixture.py'
      - 'tools/verify_ram_timeline.py'
      - 'tools/verify_timeline.py'
      - 'tools/verify_host_nmi.py'
      - 'tools/instrument_timeline_probe.py'
      - 'tests/test_ram_timeline.py'
      - 'snes/src/timeline_ram.inc'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and exact source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
          mkdir -p build
          git rev-parse HEAD > build/tested-revision.txt
          git archive --format=zip --output=build/tested-source.zip HEAD
      - name: Unit, assembler and full-memory ABI tests
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Pinned independent NES and unmodified SNES cores
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-plain-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-plain.so
          /usr/bin/python3 tools/instrument_timeline_probe.py build/fceumm --ram-bytes 2048
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-ram-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-ram.so
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes-build.log 2>&1
      - name: Independent RAM execution with host NMIs and access guards
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_ram_timeline.py \
            --nes-plain build/nes-plain.so --nes-probe build/nes-ram.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/ram-timeline 2>&1 | tee build/ram-timeline.log
      - name: Retain runtime safety, audio stress and unknown-code guards
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/nes-plain.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-safety 2>&1 | tee build/runtime-safety.log
      - name: Archive full independent captures and authored generated programs
        if: always()
        run: |
          if test -d build/ram-timeline; then
            find build/ram-timeline -type f \( -name '*.json' -o -name '*.inc' -o -name '*.s' -o -name 'initial-*.bin' -o -name 'events.bin' \) -print0 \
              | tar --null -T - -czf build/ram-timeline-evidence.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ram-timeline-verification
          path: |
            build/*.log
            build/tested-revision.txt
            build/tested-source.zip
            build/ram-timeline-evidence.tar.gz
            build/ram-timeline/ram-timeline-verification.json
            build/ram-timeline/progress.json
            build/runtime-safety/runtime-counter-verification.json
          retention-days: 30
