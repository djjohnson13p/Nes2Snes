name: Dependent native execution and interrupt timeline
on:
  workflow_dispatch:
  push:
    branches: [main, development/integrated-timeline-20260926]
    paths:
      - '.github/workflows/integrated-timeline.yml'
      - 'tools/**'
      - 'tests/**'
      - 'snes/**'
  pull_request:
    paths:
      - '.github/workflows/integrated-timeline.yml'
      - 'tools/timeline*'
      - 'tools/verify_timeline.py'
      - 'tools/instrument_timeline_probe.py'
      - 'tools/guest_cycles.py'
      - 'tools/interrupt_boundary.py'
      - 'tests/test_timeline.py'
      - 'snes/src/guest_timeline.inc'
      - 'snes/src/guest_cycles.inc'
      - 'snes/src/guest_interrupt.inc'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and exact source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
          mkdir -p build
          git rev-parse HEAD > build/tested-revision.txt
          git archive --format=zip --output=build/tested-source.zip HEAD
      - name: Unit, actual assembler and compiled harness tests
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Build pinned plain and fixture-stimulus cores
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-plain-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-plain.so
          /usr/bin/python3 tools/instrument_timeline_probe.py build/fceumm
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-stimulus-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-stimulus.so
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes-build.log 2>&1
      - name: Dependent execution, event streams, mutations and native fault guards
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_timeline.py \
            --nes-plain build/nes-plain.so --nes-probe build/nes-stimulus.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/timeline 2>&1 | tee build/timeline.log
      - name: Retain independent runtime safety
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/nes-plain.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-safety 2>&1 | tee build/runtime-safety.log
      - name: Compact full captures and exact authored programs
        if: always()
        run: |
          if test -d build/timeline; then
            find build/timeline -type f \( -name '*.json' -o -name '*.inc' -o -name '*.s' \) -print0 \
              | tar --null -T - -czf build/timeline-evidence.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-timeline-verification
          path: |
            build/*.log
            build/tested-revision.txt
            build/tested-source.zip
            build/timeline-evidence.tar.gz
            build/timeline/timeline-verification.json
            build/timeline/progress.json
            build/runtime-safety/runtime-counter-verification.json
          retention-days: 30
