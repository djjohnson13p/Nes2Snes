name: Blanked OAM ports and independent NES endpoints
on:
  workflow_dispatch:
  push:
    branches: [main, development/oam-ports-verified-20260927]
    paths: ['.github/workflows/oam-ports.yml', 'tools/**', 'tests/**', 'snes/**']
  pull_request:
    paths: ['.github/workflows/oam-ports.yml', 'tools/*oam*', 'tools/verify_palette_timeline.py', 'tests/test_oam_ports.py', 'snes/src/oam_ports.inc']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and exact tested source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
          mkdir -p build
          git rev-parse HEAD > build/tested-revision.txt
          git archive --format=zip --output=build/tested-source.zip HEAD
      - name: Unit and assembler tests
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Build pinned unmodified independent cores
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/nestopia.git build/nestopia
          git -C build/nestopia checkout 8f00f500912a847062de432e38765c7285483e62
          make -C build/nestopia/libretro -j2 > build/nestopia-build.log 2>&1
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/fceumm-build.log 2>&1
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes-build.log 2>&1
      - name: Complete OAM address and value sweep
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_oam_ports.py \
            --nes-core build/nestopia/libretro/nestopia_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/oam-ports 2>&1 | tee build/oam-ports.log
      - name: Targeted interruption, wrong-result controls and guarded prefixes
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_oam_ports.py --controls \
            --nes-core build/nestopia/libretro/nestopia_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --fce-core build/fceumm/fceumm_libretro.so \
            --out build/oam-controls 2>&1 | tee build/oam-controls.log
      - name: Retain complete palette and nametable execution
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_palette_timeline.py \
            --nes-core build/nestopia/libretro/nestopia_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/retained-palette 2>&1 | tee build/retained-palette.log
          /usr/bin/python3 tools/verify_nametable_palette.py \
            --nes-core build/nestopia/libretro/nestopia_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/retained-nametable 2>&1 | tee build/retained-nametable.log
      - name: Retain runtime safety, fault guards and audio stress
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/fceumm/fceumm_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-safety 2>&1 | tee build/runtime-safety.log
      - name: Archive authored inputs and raw independent observations
        if: always()
        run: |
          roots=()
          for d in build/oam-ports build/oam-controls; do
            if test -d "$d"; then roots+=("$d"); fi
          done
          if ((${#roots[@]})); then
            find "${roots[@]}" -type f \( -name '*.json' -o -name '*.nst' -o -name '*.nes' -o -name '*.inc' -o -name '*.s' \) -print0 | \
              tar --null -T - -czf build/oam-evidence.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oam-ports-verification
          path: |
            build/*.log
            build/tested-revision.txt
            build/tested-source.zip
            build/oam-evidence.tar.gz
            build/oam-ports/oam-ports-verification.json
            build/oam-controls/oam-ports-controls.json
            build/retained-palette/palette-timeline-verification.json
            build/retained-nametable/nametable-palette-verification.json
            build/runtime-safety/runtime-counter-verification.json
          retention-days: 30
