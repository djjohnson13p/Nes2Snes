name: Build and emulator verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build native SNES synthetic fixture
        run: /usr/bin/python3 tools/build_viewer.py --synthetic --out build/synthetic
      - name: Build pinned independent emulator
        run: |
          git clone https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2
      - name: Verify every page and controller behavior
        run: |
          /usr/bin/python3 tools/verify_viewer.py \
            --core build/snes9x/libretro/snes9x_libretro.so \
            --sfc build/synthetic/chr-viewer.sfc \
            --synthetic --out build/synthetic/verification
      - name: Build and verify procedural native sprite scene
        run: |
          /usr/bin/python3 tools/synthetic_scene.py --out build/synthetic-scene-capture
          /usr/bin/python3 tools/build_scene.py --snapshot build/synthetic-scene-capture --out build/synthetic-scene
          /usr/bin/python3 tools/verify_scene.py \
            --core build/snes9x/libretro/snes9x_libretro.so \
            --sfc build/synthetic-scene/frozen-scene.sfc \
            --snapshot build/synthetic-scene-capture --out build/synthetic-scene/verification
      - name: Build pinned NES oracle
        run: |
          git clone https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2
      - name: Differential native CPU and mapper verification
        run: |
          /usr/bin/python3 tools/native_fixture.py --out build/native-fixture
          /usr/bin/python3 tools/build_native.py --rom build/native-fixture/fixture.nes --trace build/native-fixture --out build/native-fixture/snes
          /usr/bin/python3 tools/verify_native_cpu.py --nes-core build/fceumm/fceumm_libretro.so --snes-core build/snes9x/libretro/snes9x_libretro.so --fixture build/native-fixture --out build/native-fixture/verification
      - name: Fast-path regression, live bank changes and OAM copies
        run: |
          if [ -f tools/fastpath_fixture.py ]; then
            for seed in 0 7; do
              out="build/fastpath-seed${seed}"
              /usr/bin/python3 tools/fastpath_fixture.py --out "$out" --seed "$seed"
              /usr/bin/python3 tools/build_native.py --rom "$out/fixture.nes" --trace "$out" --out "$out/snes"
              /usr/bin/python3 tools/verify_native_cpu.py --nes-core build/fceumm/fceumm_libretro.so --snes-core build/snes9x/libretro/snes9x_libretro.so --fixture "$out" --out "$out/verification"
            done
          fi
      - name: Archive the tested source revision
        run: git archive --format=zip --output=build/tested-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-snes-viewer-and-verification
          path: |
            build/native-fixture/verification/
            build/fastpath-seed*/verification/
            build/tested-source.zip
            build/synthetic/chr-viewer.sfc
            build/synthetic/viewer-build.json
            build/synthetic/verification/
            build/synthetic-scene/frozen-scene.sfc
            build/synthetic-scene/scene-build.json
            build/synthetic-scene/verification/
          retention-days: 14
