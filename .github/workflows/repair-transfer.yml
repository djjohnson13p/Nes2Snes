name: Repair staged renderer transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-transfer.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact tested patch bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('maintenance/checkpoint/part1.b64')
          raw = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == 'e503b08ae77ea52061f2c6565a94452ef8b184ea'
          fixed = raw.replace(b'YbXW85e/Rnew', b'YbX85e/Rnew').replace(b'3z090rceMUD', b'3z090r4+MUD')
          assert hashlib.sha256(fixed).hexdigest() == '7e7021053d478585459cf680c174dceded53c363d4910c6f3ffa35c53e725da5'
          p.write_bytes(fixed)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maintenance/checkpoint/part1.b64
          git rm .github/workflows/repair-transfer.yml
          git commit -m 'Restore verified renderer transfer and remove one-use repair'
          git push origin HEAD:main
