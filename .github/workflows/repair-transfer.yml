name: Repair staged source transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-transfer.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact tested patch bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('maintenance/checkpoint/part0.b64')
          raw = p.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'bd2017973390b0175545c29d0e9623b5cdeedb3937d04a198df23ef4499916ad'
          assert raw.count(b'8Uav4PZZDLWSj3OEP') == 1
          raw = raw.replace(b'8Uav4PZZDLWSj3OEP', b'8Uav4PZDLWSj3OEP', 1)
          assert hashlib.sha256(raw).hexdigest() == 'fd132a542fee8ff7a4b58ae18718b1b63bb150ec64ca5eec81ba35f750d3b8d7'
          p.write_bytes(raw)
          for name, expected in [('part1.b64', 'a3302c49b7a1d52255573893d9f407955f192d087be153dcb32cd540dd6289ae'), ('part2.b64', 'df8051a11a783ceee28d6bfd5c604b78208e918200f7970ba327eb5a6e18979d')]:
              assert hashlib.sha256((p.parent / name).read_bytes()).hexdigest() == expected
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maintenance/checkpoint/part0.b64
          git rm .github/workflows/repair-transfer.yml
          git commit -m 'Restore exact source-transfer checksum and remove one-use repair'
          git push origin HEAD:main
