name: MMC5 cartridge RAM and protected writes
on:
  workflow_dispatch:
  push:
    branches: [main, development/mmc5-cartridge-ram-20260926]
    paths: ['.github/workflows/wram-timeline.yml', 'tools/**', 'tests/**', 'snes/**']
  pull_request:
    paths: ['.github/workflows/wram-timeline.yml', 'tools/*timeline*', 'tools/mmc5_wram.py', 'tests/test_wram_timeline.py', 'snes/src/mmc5_wram.inc']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and exact tested source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
          mkdir -p build
          git rev-parse HEAD > build/tested-revision.txt
          git archive --format=zip --output=build/tested-source.zip HEAD
      - name: Unit, actual assembler and compiled capture checks
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Pinned original cores and separate observers
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-plain-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-plain.so
          /usr/bin/python3 tools/instrument_mmc5_timeline.py build/fceumm
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-mapper-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-mapper.so
          git -C build/fceumm checkout -- src/x6502.c
          rm build/fceumm/src/n2s_timeline_probe.h
          /usr/bin/python3 tools/instrument_wram_timeline.py build/fceumm
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-wram-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-wram.so
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes-build.log 2>&1
      - name: Independent RAM pages, protection, corruption controls and guards
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_wram_timeline.py \
            --nes-plain build/nes-plain.so --nes-probe build/nes-wram.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/wram-timeline 2>&1 | tee build/wram-timeline.log
      - name: Retain bank-qualified ROM execution and its guards
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_mmc5_timeline.py \
            --nes-plain build/nes-plain.so --nes-probe build/nes-mapper.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/retained-mmc5 2>&1 | tee build/retained-mmc5.log
      - name: Retain runtime safety and fault guards
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/nes-plain.so --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-safety 2>&1 | tee build/runtime-safety.log
      - name: Archive full authored captures and generated source
        if: always()
        run: |
          if test -d build/wram-timeline; then
            find build/wram-timeline -type f \( -name '*.json' -o -name '*.inc' -o -name '*.s' -o -name '*prg.bin' \) -print0 | \
              tar --null -T - -czf build/wram-evidence.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wram-timeline-verification
          path: |
            build/*.log
            build/tested-revision.txt
            build/tested-source.zip
            build/wram-evidence.tar.gz
            build/wram-timeline/wram-timeline-verification.json
            build/retained-mmc5/mmc5-timeline-verification.json
            build/runtime-safety/runtime-counter-verification.json
          retention-days: 30
