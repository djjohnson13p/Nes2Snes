name: Raster geometry and route validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raster.yml'
      - 'snes/src/native*'
      - 'snes/linker/native.cfg'
      - 'tools/build_native.py'
      - 'tools/raster_fixture.py'
      - 'tools/verify_raster.py'
      - 'tools/gameplay_route.py'
      - 'tools/verify_reference_route.py'
      - 'tools/routes/*.json'
      - 'tests/test_gameplay_actions.py'
      - 'tests/test_raster_fixture.py'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
      - name: Unit tests and route-script validation
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build pinned independent emulators
        run: |
          mkdir -p build
          git clone https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2
          git clone https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2
      - name: Stable-region geometry with explicit partial-row mismatch counts
        run: |
          /usr/bin/python3 tools/verify_raster.py \
            --nes-core build/fceumm/fceumm_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/raster-matrix
      - name: CPU, PPU and all-bank regressions with raster option enabled
        run: |
          for fixture in native ppu direct; do
            out="build/raster-regression/$fixture"
            /usr/bin/python3 "tools/${fixture}_fixture.py" --out "$out"
            /usr/bin/python3 tools/build_native.py --rom "$out/fixture.nes" --trace "$out" \
              --out "$out/snes" --experimental-raster-scroll
            /usr/bin/python3 tools/verify_native_cpu.py \
              --nes-core build/fceumm/fceumm_libretro.so \
              --snes-core build/snes9x/libretro/snes9x_libretro.so \
              --fixture "$out" --out "$out/verification"
          done
      - name: Archive tested source
        run: |
          git archive --format=zip --output=build/tested-source.zip HEAD
          git rev-parse HEAD > build/tested-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: raster-geometry-verification
          path: |
            build/raster-matrix/raster-verification.json
            build/raster-matrix/y*/verification.json
            build/raster-matrix/y*/nes.png
            build/raster-matrix/y*/snes.png
            build/raster-regression/*/verification/
            build/tested-source.zip
            build/tested-revision.txt
          retention-days: 30
