name: Apply exact counter-free source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-counterfree.yml']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
      - name: Apply only hash-verified UTF-8 source
        run: /usr/bin/python3 maintenance/counterfree/apply.py
      - name: Verify the source before publication
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Publish and remove one-use transfer files
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r maintenance/counterfree .github/workflows/apply-counterfree.yml
          git commit -m 'Separate runtime profiling overhead from gameplay and document engineering limits'
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
