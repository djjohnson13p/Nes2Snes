name: APU counters and envelope verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apu-counters.yml'
      - 'snes/src/native*'
      - 'snes/linker/native.cfg'
      - 'tools/apu*.py'
      - 'tools/audio*.py'
      - 'tools/direct_calls.py'
      - 'tools/build_native.py'
      - 'tools/verify_apu*.py'
      - 'tools/verify_native_cpu.py'
      - 'tests/test_apu_counters.py'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build pinned independent emulators
        run: |
          mkdir -p build
          git clone https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2
          git clone https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2
      - name: Independent length oracle, envelope contract and actual PCM
        run: |
          /usr/bin/python3 tools/verify_apu_matrix.py \
            --nes-core build/fceumm/fceumm_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/apu-matrix
      - name: Archive tested source revision
        run: |
          git archive --format=zip --output=build/tested-source.zip HEAD
          git rev-parse HEAD > build/tested-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apu-counters-and-envelope-verification
          path: |
            build/apu-matrix/apu-matrix.json
            build/apu-matrix/length-*/verification/
            build/apu-matrix/envelope-*/verification/
            build/tested-source.zip
            build/tested-revision.txt
          retention-days: 30
