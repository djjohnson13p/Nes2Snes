name: Native table dispatch and retained runtime safety
on:
  workflow_dispatch:
  push:
    branches: [main, development/native-dispatch-20260926, development/palette-reads-20260926]
    paths:
      - '.github/workflows/native-dispatch.yml'
      - 'maintenance/native-dispatch/**'
      - 'snes/**'
      - 'tools/**'
      - 'tests/**'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install assembler and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
      - name: Integrate only the checksum-verified baseline edits
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'native_inline_dispatch:bool=False' tools/build_native.py; then
            /usr/bin/python3 maintenance/native-dispatch/apply.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/build_native.py tools/verify_native_cpu.py
            git commit -m 'Integrate guarded native dispatch with original fallback and unchanged defaults'
          fi
          mkdir -p build
          git rev-parse HEAD > build/tested-revision.txt
          git archive --format=zip --output=build/tested-source.zip HEAD
      - name: Unit tests including actual assembler output
        shell: bash
        run: /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Build pinned unmodified NES and SNES reference emulators
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes9x-build.log 2>&1
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/fceumm-build.log 2>&1
      - name: Forty-five independent dispatch configurations and unknown-target guards
        shell: bash
        run: |
          /usr/bin/python3 tools/verify_native_dispatch.py \
            --nes-core build/fceumm/fceumm_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/native-dispatch 2>&1 | tee build/native-dispatch.log
      - name: Same-revision omitted versus explicitly disabled dispatch
        run: |
          /usr/bin/python3 tools/verify_default_options.py --fixtures dispatch --out build/default-identity
      - name: Retain independent CPU, audio and counter-free safety tests
        shell: bash
        run: |
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/fceumm/fceumm_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-counters 2>&1 | tee build/runtime-counters.log
      - name: Publish tested integration to its development branch only
        if: github.ref == 'refs/heads/development/native-dispatch-20260926'
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/development/native-dispatch-20260926 | cut -f1)
          test "$current" = "$GITHUB_SHA" || { echo 'Branch changed; refusing to overwrite it'; exit 1; }
          git push origin HEAD:refs/heads/development/native-dispatch-20260926
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-dispatch-verification
          path: |
            build/*.log
            build/tested-revision.txt
            build/tested-source.zip
            build/default-identity/identity.json
            build/native-dispatch/native-dispatch-verification.json
            build/native-dispatch/progress.json
            build/native-dispatch/*/verification/*.json
            build/native-dispatch/unknown-target-*/fault.json
            build/runtime-counters/runtime-counter-verification.json
            build/runtime-counters/progress.json
          retention-days: 30
