name: Blanked palette transfers and independent Nestopia endpoints
on:
  workflow_dispatch:
  push:
    branches: [main, development/palette-timeline-20260927, development/nametable-readback-20260927]
    paths: ['.github/workflows/palette-timeline.yml', 'tools/**', 'tests/**', 'snes/**']
  pull_request:
    paths: ['.github/workflows/palette-timeline.yml', 'tools/*palette*', 'tests/test_palette_timeline.py', 'snes/src/palette_timeline.inc']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and exact tested source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
          mkdir -p build
          git rev-parse HEAD > build/tested-revision.txt
          git archive --format=zip --output=build/tested-source.zip HEAD
      - name: Unit and actual assembler tests
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log
      - name: Pinned unmodified Nestopia, plain FCEUmm and retained CHR observer
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libretro/nestopia.git build/nestopia
          git -C build/nestopia checkout 8f00f500912a847062de432e38765c7285483e62
          make -C build/nestopia/libretro -j2 > build/nestopia-build.log 2>&1
          git clone --quiet https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-plain-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-plain.so
          /usr/bin/python3 tools/instrument_chr_blank.py build/fceumm
          make -C build/fceumm -f Makefile.libretro -j2 > build/nes-chr-build.log 2>&1
          cp build/fceumm/fceumm_libretro.so build/nes-chr.so
          git clone --quiet https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2 > build/snes-build.log 2>&1
      - name: Independent palette readback and stable program endpoints
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_palette_timeline.py \
            --nes-core build/nestopia/libretro/nestopia_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/palette-timeline 2>&1 | tee build/palette-timeline.log
      - name: Targeted host interruption, wrong-result controls and independent guards
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_palette_controls.py \
            --nes-core build/nestopia/libretro/nestopia_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so --fce-core build/nes-plain.so \
            --out build/palette-controls 2>&1 | tee build/palette-controls.log
      - name: Complete nametable selectors, fill bits and isolated reference diagnostics
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_nametable_palette.py \
            --nes-core build/nestopia/libretro/nestopia_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/nametable-palette 2>&1 | tee build/nametable-palette.log
          /usr/bin/python3 tools/verify_nametable_palette.py --controls \
            --nes-core build/nestopia/libretro/nestopia_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so --fce-core build/nes-plain.so \
            --out build/nametable-controls 2>&1 | tee build/nametable-controls.log
      - name: Retain complete independent CHR execution
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_chr_blank.py \
            --nes-plain build/nes-plain.so --nes-probe build/nes-chr.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/retained-chr 2>&1 | tee build/retained-chr.log
      - name: Retain runtime fault guards and audio stress
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/nes-plain.so --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-safety 2>&1 | tee build/runtime-safety.log
      - name: Archive actual endpoint captures and authored source
        if: always()
        run: |
          roots=()
          for d in build/palette-timeline build/palette-controls build/nametable-palette build/nametable-controls; do
            if test -d "$d"; then roots+=("$d"); fi
          done
          if ((${#roots[@]})); then
            find "${roots[@]}" -type f \( -name '*.json' -o -name '*.nst' -o -name '*.nes' -o -name '*.inc' -o -name '*.s' -o -name '*prg.bin' \) -print0 | \
              tar --null -T - -czf build/palette-evidence.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-timeline-verification
          path: |
            build/*.log
            build/tested-revision.txt
            build/tested-source.zip
            build/palette-evidence.tar.gz
            build/palette-timeline/palette-timeline-verification.json
            build/palette-controls/palette-controls.json
            build/nametable-palette/nametable-palette-verification.json
            build/nametable-controls/nametable-palette-controls.json
            build/retained-chr/chr-blank-verification.json
            build/runtime-safety/runtime-counter-verification.json
          retention-days: 30
