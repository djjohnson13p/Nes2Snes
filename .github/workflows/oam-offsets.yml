name: Sprite DMA offsets and integrated runtime safety
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oam-offsets.yml'
      - 'snes/**'
      - 'tools/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 python3-numpy python3-pil
      - name: Unit and actual assembler tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build three pinned unmodified emulators
        run: |
          mkdir -p build
          git clone https://github.com/libretro/snes9x.git build/snes9x
          git -C build/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          make -C build/snes9x/libretro -j2
          git clone https://github.com/libretro/libretro-fceumm.git build/fceumm
          git -C build/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          make -C build/fceumm -f Makefile.libretro -j2
          git clone https://github.com/libretro/nestopia.git build/nestopia
          git -C build/nestopia checkout 8f00f500912a847062de432e38765c7285483e62
          make -C build/nestopia/libretro -j2
      - name: All offsets in counted and counter-free modes, negative control and disagreements
        run: |
          mkdir -p build/previous-source
          git archive a19a87c328e47e3603e3f049b605a85693e230c9 | tar -x -C build/previous-source
          /usr/bin/python3 tools/verify_oam_offsets.py \
            --nes-core build/nestopia/libretro/nestopia_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --fceumm-core build/fceumm/fceumm_libretro.so \
            --previous-root build/previous-source --out build/oam-offsets
      - name: Retain independent counter-free CPU tests and unknown-code fault guards
        run: |
          /usr/bin/python3 tools/verify_runtime_counters.py \
            --nes-core build/fceumm/fceumm_libretro.so \
            --snes-core build/snes9x/libretro/snes9x_libretro.so \
            --out build/runtime-counter-matrix
      - name: Archive exact tested source
        run: |
          git archive --format=zip --output=build/tested-source.zip HEAD
          git rev-parse HEAD > build/tested-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oam-offsets-and-runtime-verification
          path: |
            build/oam-offsets/oam-offset-matrix.json
            build/oam-offsets/partial-results.json
            build/oam-offsets/unrestricted-latch/reference-disagreement.json
            build/oam-offsets/previous-offset-1/verification/*.json
            build/runtime-counter-matrix/runtime-counter-verification.json
            build/runtime-counter-matrix/progress.json
            build/tested-source.zip
            build/tested-revision.txt
          retention-days: 30
